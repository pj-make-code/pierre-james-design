.mono{font-family:'Departure Mono',ui-monospace,monospace;letter-spacing:0;-webkit-font-smoothing:none;font-smooth:never}
.more{position:relative;padding:10px 4px;margin:-10px -4px;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:4px;transition:text-decoration-color 150ms}
.more:hover{text-decoration-color:#ffffff}
.bright{color:#ffffff;text-decoration:underline;text-decoration-color:rgba(255,255,255,.25);text-underline-offset:5px;text-decoration-thickness:1px;transition:text-decoration-color 150ms}
.bright:hover{text-decoration-color:#ffffff}
.quiet:hover{color:#ffffff}
.brand-link{text-decoration:underline;text-decoration-color:transparent;text-underline-offset:4px;text-decoration-thickness:1px;transition:text-decoration-color 150ms}
.brand-link:hover{text-decoration-color:currentColor}
.card{transition:border-color 150ms,transform 250ms cubic-bezier(.2,.8,.2,1)}
.card:hover{border-color:rgba(255,255,255,.2);transform:translateY(-2px)}
.card .cover-inner{transition:transform 400ms cubic-bezier(.2,.8,.2,1)}
.card:hover .cover-inner{transform:scale(1.03)}
.ghost{transition:background 150ms,color 150ms}
.ghost:hover{background:rgba(255,255,255,.06);color:#ffffff}
.menu-btn{transition:background 150ms,transform 150ms}
.menu-btn:hover{background:rgba(255,255,255,.06)}
.menu-btn:active{transform:scale(.97)}
.menu-item{transition:background 120ms,color 120ms}
.menu-item:hover{background:rgba(255,255,255,.05);color:#ffffff}
.pill{transition:transform 150ms,background 150ms}
.pill:active{transform:scale(.97)}
.row{position:relative;transition:background 120ms}
.row:hover{background:rgba(255,255,255,.03)}
.row-link::after{content:"";position:absolute;inset:0}
.tile{transition:opacity 150ms}
.tile:hover{opacity:.86}
.tab{transition:background 120ms,color 120ms}
.tab:hover{color:#ffffff}
.toc{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:30;display:flex;flex-direction:column;gap:10px;padding:12px}
.toc a{display:flex;align-items:center;justify-content:flex-end;gap:10px;color:#8f8f8f}
.toc .toc-label{opacity:0;transform:translateX(6px);transition:opacity 150ms,transform 150ms;font-size:13px;white-space:nowrap;background:#1a1a1a;padding:2px 8px;border-radius:6px}
.toc:hover .toc-label,.toc a:focus-visible .toc-label{opacity:1;transform:none}
.toc .toc-line{width:16px;height:2px;border-radius:2px;background:#3a3a3a;transition:background 150ms,width 150ms}
.toc a:hover .toc-line{background:#ffffff;width:22px}
.layer{outline:none}
.layer-center{position:fixed;z-index:50;left:50%;top:min(5vh,48px);transform:translateX(-50%);width:min(900px,92vw);height:min(90vh,960px);overflow:auto;background:#1c1c1c;border:1px solid rgba(255,255,255,.08);border-radius:16px;box-shadow:0 30px 90px rgba(0,0,0,.6);animation:peek-in 200ms cubic-bezier(.2,.8,.2,1)}
.layer-side{position:fixed;z-index:50;top:0;right:0;height:min(100vh,1200px);width:min(720px,94vw);overflow:auto;background:#1c1c1c;border-left:1px solid rgba(255,255,255,.08);box-shadow:-30px 0 90px rgba(0,0,0,.5);animation:side-in 220ms cubic-bezier(.2,.8,.2,1)}
.layer-full{position:relative;background:#202020}
.layer-bar{background:rgba(28,28,28,.92)}
.layer-full .layer-bar{background:rgba(32,32,32,.9)}
.cover-block{height:200px}
.layer-full .cover-block{height:30vh;min-height:240px;max-height:360px}
.doc{max-width:720px;margin:0 auto;padding:0 56px 72px}
.layer-full .doc{padding:0 24px 140px}
.icon-ring{border:4px solid #1c1c1c}
.layer-full .icon-ring{border-color:#202020}
.toggle-chev{transition:transform 150ms}
.toggle-open .toggle-chev{transform:rotate(90deg)}
.chip-btn{transition:background 120ms,border-color 120ms,color 120ms}
.chip-btn:hover{border-color:rgba(255,255,255,.22);color:#ffffff}
.game-canvas{touch-action:pan-y;cursor:pointer}
.game-canvas.playing{touch-action:none;cursor:none}
.photo-grid{columns:3 200px;column-gap:12px}
@keyframes peek-in{from{opacity:0;transform:translateX(-50%) translateY(14px) scale(.985)}to{opacity:1;transform:translateX(-50%)}}
@keyframes side-in{from{opacity:.4;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes sheet-in{from{transform:translateY(60px);opacity:.5}to{transform:none;opacity:1}}
@keyframes drop{from{opacity:0;transform:scale(.94) translateY(-6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (max-width:1180px){.toc{display:none}}
@media (max-width:760px){.hero{flex-direction:column;align-items:flex-start!important;padding-top:120px!important;min-height:0!important}.about-row{flex-direction:column}}
@media (max-width:640px){
.layer-center,.layer-side{left:0;right:0;top:24px;bottom:0;width:auto;height:auto;transform:none;border-radius:16px 16px 0 0;border:0;animation:sheet-in 240ms cubic-bezier(.2,.8,.2,1)}
.doc{padding:0 20px 64px}
.hide-sm{display:none!important}
}
@media (prefers-reduced-motion:reduce){.pj *{animation:none!important;transition:none!important}}
</style>

  hitShip(t) {
    const g = this.g;
    g.lives -= 1; g.bombs = []; g.shot = null;
    g.deadUntil = t + 900; g.blinkUntil = t + 2300;
    if (g.lives <= 0) { g.lives = 0; this.setState({ game: 'over' }); }
  }
  gTick(t) {
    const g = this.g;
    if (!g) { this.raf = null; return; }
    const st = this.state.game;
    const dt = this.last == null ? 0 : Math.min(0.033, (t - this.last) / 1000); this.last = t;
    // the ship follows the pointer's x (and the arrow keys) in every state
    if (g.keys.left) g.tx -= 420 * dt;
    if (g.keys.right) g.tx += 420 * dt;
    const half = g.shipW / 2;
    g.tx = Math.max(half + 2, Math.min(g.w - half - 2, g.tx));
    g.px += (g.tx - g.px) * Math.min(1, dt * 16);
    const alive = g.inv.filter((e) => e.alive);
    // the formation marches in steps; in idle it marches in place as an attract loop
    if ((st === 'playing' || (st === 'idle' && !this.reduce)) && t >= g.nextStep && alive.length) {
      g.nextStep = t + (st === 'playing' ? Math.max(28, 620 * alive.length / g.total - (g.wave - 1) * 40) : 520);
      g.frame ^= 1;
      const dx = 2 * g.S * g.dir;
      let minX = Infinity, maxX = -Infinity;
      alive.forEach((e) => { minX = Math.min(minX, e.x); maxX = Math.max(maxX, e.x + e.w); });
      if ((g.dir > 0 && maxX + dx > g.w - 4) || (g.dir < 0 && minX + dx < 4)) {
        g.dir = -g.dir;
        if (st === 'playing') g.inv.forEach((e) => { e.y += 4 * g.S; });
      } else g.inv.forEach((e) => { e.x += dx; });
      if (st === 'playing') alive.forEach((e) => this.eraseShieldRect(e.x, e.y, e.w, e.h));
    }
    if (st === 'playing') {
      if (g.keys.fire) this.fire();
      if (g.shot) {
        g.shot.y -= 640 * dt;
        if (g.shot.y < 16) g.shot = null;
        else {
          for (let i = 0; i < alive.length; i++) {
            const e = alive[i];
            if (g.shot.x >= e.x && g.shot.x <= e.x + e.w && g.shot.y <= e.y + e.h && g.shot.y + 4 * g.S >= e.y) {
              e.alive = false; g.score += POINTS[e.t]; g.booms.push({ x: e.x + e.w / 2, y: e.y + e.h / 2, until: t + 220 }); g.shot = null; break;
            }
          }
          if (g.shot && (this.shieldHit(g.shot.x, g.shot.y) || this.shieldHit(g.shot.x, g.shot.y + 2 * g.S))) g.shot = null;
        }
      }
      if (t >= g.nextBomb && alive.length && g.bombs.length < 3 && t > g.deadUntil) {
        const pick = alive[Math.floor(Math.random() * alive.length)];
        const shooter = alive.filter((e) => e.col === pick.col).sort((a, b) => b.row - a.row)[0];
        g.bombs.push({ x: shooter.x + shooter.w / 2, y: shooter.y + shooter.h, f: 0 });
        g.nextBomb = t + Math.max(260, 1100 - (g.total - alive.length) * 14 - (g.wave - 1) * 100) + Math.random() * 600;
      }
      g.bombs.forEach((b) => { b.y += 210 * dt; b.f += dt; });
      g.bombs = g.bombs.filter((b) => {
        if (b.y > g.h) return false;
        if (this.shieldHit(b.x, b.y + 7 * g.S)) return false;
        if (g.shot && Math.abs(g.shot.x - b.x) <= 2 * g.S && g.shot.y <= b.y + 8 * g.S && g.shot.y + 4 * g.S >= b.y) { g.shot = null; return false; }
        if (this.state.game === 'playing' && t > g.blinkUntil && b.y + 8 * g.S >= g.py + 2 * g.S && b.y <= g.py + g.shipH && Math.abs(b.x - g.px) <= g.shipW / 2 - g.S) { this.hitShip(t); return false; }
        return true;
      });
      const left = g.inv.filter((e) => e.alive);
      if (!left.length) { g.wave += 1; g.bombs = []; g.shot = null; this.newWave(); g.nextStep = t + 900; g.nextBomb = t + 1800; }
      else if (Math.max.apply(null, left.map((e) => e.y + e.h)) >= g.py) { this.setState({ game: 'over' }); }
      if (g.score > g.hi) g.hi = g.score;
    }
    g.booms = g.booms.filter((b) => b.until > t);
    this.gDraw(t);
    this.raf = requestAnimationFrame(this.tick);
  }

  /* ---------- render ---------- */
  chipsFor(p) { return p.tags.map((k) => TAGS[k]); }
  card(p) {
    const c = TAGS[p.cover];
    return Object.assign({}, p, {
      href: '#/work/' + p.slug + '/', open: (e) => this.openP(p.slug, e),
      coverBg: c.bg, coverFg: c.fg, chips: this.chipsFor(p), roleText: p.role.join(', '),
      statusDot: STATUS_DOT[p.status] || '#8f8f8f'
    });
  }
  photo(ph, i) { return Object.assign({}, ph, { n: i + 1, open: () => this.setState({ lb: i }) }); }

  renderVals() {
    const s = this.state;
    const props = this.props || {};
    const peekStyle = props.peekStyle ?? 'center';

    const isHome = s.view === 'home';
    const isWork = s.view === 'work';
    const isAbout = s.view === 'about';
    const isPhotos = s.view === 'photos';
    const isProjectView = s.view === 'project';
    const isPeek = !!s.peek;
    const showProject = isPeek || isProjectView;
    const isFull = isProjectView && !isPeek;
    const currentSlug = s.peek || s.slug || 'hale';

    // URL
    let path = '/';
    if (isWork) {
      const q = [];
      if (s.tags.length) q.push('tag=' + s.tags.join(','));
      if (s.type !== 'All') q.push('type=' + s.type.toLowerCase());
      if (s.dbView === 'table') q.push('view=table');
      if (s.sort === 'old') q.push('sort=oldest');
      path = '/work/' + (q.length ? '?' + q.join('&') : '');
    }
    if (isAbout) path = '/about/';
    if (isPhotos) path = '/photos/' + (s.photoTab !== 'feed' ? '?tab=' + (s.photoTab === 'stocks' ? 'film-stocks' : s.photoTab) : '');
    if (isHome && s.section && s.section !== 'top') path = '/#' + s.section;
    if (isProjectView) path = '/work/' + s.slug + '/';
    if (isPeek) path = '/work/' + s.peek + '/';

    // project
    const p = PROJECTS.find((x) => x.slug === currentSlug) || PROJECTS[0];
    const navList = isWork ? this.filtered() : PROJECTS;
    let idx = navList.findIndex((x) => x.slug === p.slug); if (idx < 0) idx = 0;
    const prevP = navList[(idx - 1 + navList.length) % navList.length] || p;
    const nextP = navList[(idx + 1) % navList.length] || p;
    const navGo = (slug) => (e) => { if (e && e.preventDefault) e.preventDefault(); if (isPeek) this.setState({ peek: slug }); else this.openFull(slug); };
    const blocks = p.blocks.map((b, i) => {
      const key = p.slug + ':' + i;
      const open = !!s.toggles[key];
      return Object.assign({}, b, {
        id: 'blk-' + p.slug + '-' + i, isH2: b.k === 'h2', isP: b.k === 'p', isCallout: b.k === 'callout', isToggle: b.k === 'toggle',
        isColumns: b.k === 'columns', isFigure: b.k === 'figure', isQuote: b.k === 'quote', isStats: b.k === 'stats', isBookmark: b.k === 'bookmark',
        open: open, openClass: open ? 'toggle-open' : '',
        flip: () => { const t = Object.assign({}, this.state.toggles); t[key] = !t[key]; this.setState({ toggles: t }); }
      });
    });
    const proj = Object.assign({}, this.card(p), {
      blocks: blocks, links: p.links || [],
      prev: { title: prevP.title, href: '#/work/' + prevP.slug + '/', go: navGo(prevP.slug) },
      next: { title: nextP.title, href: '#/work/' + nextP.slug + '/', go: navGo(nextP.slug) }
    });
    const toc = blocks.filter((b) => b.isH2).map((b) => ({ text: b.text, href: '#' + b.id }));

    // work db
    const list = this.filtered().map((x) => this.card(x));
    const tagChips = Object.keys(TAGS).map((k) => {
      const sel = s.tags.indexOf(k) >= 0; const t = TAGS[k];
      return { label: t.label, on: sel, bg: sel ? t.bg : 'transparent', fg: sel ? t.fg : '#a8a8a8', border: sel ? t.fg : 'rgba(255,255,255,.14)', toggle: () => this.toggleTag(k) };
    });
    const typeChips = ['All'].concat(TYPES).map((ty) => {
      const sel = s.type === ty;
      return { label: ty, on: sel, bg: sel ? '#2c2c2c' : 'transparent', fg: sel ? '#ffffff' : '#a8a8a8', border: sel ? 'rgba(255,255,255,.5)' : 'rgba(255,255,255,.14)', pick: () => this.setState({ type: ty }) };
    });

    // photos
    const allPhotos = PHOTOS.map((ph, i) => this.photo(ph, i));
    let photoGroups;
    if (s.photoTab === 'stocks') {
      const order = [];
      allPhotos.forEach((ph) => { if (order.indexOf(ph.stock) < 0) order.push(ph.stock); });
      photoGroups = order.map((st) => { const items = allPhotos.filter((ph) => ph.stock === st); return { titled: true, title: st, count: items.length + (items.length === 1 ? ' frame' : ' frames'), items: items }; });
    } else if (s.photoTab === 'concerts') {
      photoGroups = [{ titled: false, title: '', count: '', items: allPhotos.filter((ph) => ph.concert) }];
    } else {
      photoGroups = [{ titled: false, title: '', count: '', items: allPhotos }];
    }
    const photoTabs = PHOTO_TABS.map((t) => ({ label: t[1], on: s.photoTab === t[0], bg: s.photoTab === t[0] ? '#ffffff' : 'transparent', fg: s.photoTab === t[0] ? '#202020' : '#a8a8a8', pick: () => this.setState({ photoTab: t[0] }) }));
    const lbData = s.lb !== null ? Object.assign({}, PHOTOS[s.lb], { n: s.lb + 1 }) : Object.assign({}, PHOTOS[0], { n: 1 });
    const lbStep = (d) => this.setState({ lb: (this.state.lb + d + PHOTOS.length) % PHOTOS.length });

    // menu: on home, items scroll to sections; elsewhere they open full pages
    const active = isHome ? s.section : (isWork || isProjectView ? 'work' : isAbout ? 'about' : isPhotos ? 'photos' : '');
    const menuItems = [['Work', 'work'], ['About', 'about'], ['Photos', 'photos'], ['Contact', 'contact']].map((m) => ({
      label: m[0], color: active === m[1] ? '#ffffff' : '#8f8f8f', current: active === m[1] ? 'location' : undefined,
      go: (e) => {
        this.restorePill = false;
        if (isHome || m[1] === 'contact') this.go(m[1], e); else this.goPage(m[1], e);
      }
    }));
    const homeActive = isHome && (s.section === 'top' || !s.section);

    return {
      showUrl: props.showUrl ?? true,
      path: path,
      isHome: isHome, isWork: isWork, isAbout: isAbout, isPhotos: isPhotos,
      showProject: showProject, isPeek: isPeek, isFull: isFull,
      layerMode: isPeek ? peekStyle : 'full',
      layerRole: isPeek ? 'dialog' : 'region',

      featured: PROJECTS.filter((x) => x.featured).sort((a, b) => a.order - b.order).map((x) => this.card(x)),
      goHome: (e) => this.go('top', e),
      openHale: (e) => this.openP('hale', e),
      goContact: (e) => this.go('contact', e),
      goWork: (e) => this.goPage('work', e),
      goAboutPage: (e) => this.goPage('about', e),
      goPhotosPage: (e) => this.goPage('photos', e),

      tools: TOOLS.map((t) => ({ label: t })),
      spotifyIdle: !s.spotify, spotifyLoaded: s.spotify,
      loadSpotify: () => this.setState({ spotify: true }),

      homePhotos: allPhotos.slice(0, 6), photoGroups: photoGroups, photoTabs: photoTabs, photoCount: PHOTOS.length,
      lbOpen: s.lb !== null, lb: lbData,
      lbClose: () => this.setState({ lb: null }),
      lbPrev: () => lbStep(-1), lbNext: () => lbStep(1),
      lbKey: (e) => {
        if (e.key === 'Escape') { e.preventDefault(); this.setState({ lb: null }); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); lbStep(-1); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); lbStep(1); }
      },
      lbTouchStart: (e) => { this.tx = e.touches && e.touches[0] ? e.touches[0].clientX : null; },
      lbTouchEnd: (e) => {
        if (this.tx == null || !e.changedTouches || !e.changedTouches[0]) return;
        const dx = e.changedTouches[0].clientX - this.tx; this.tx = null;
        if (Math.abs(dx) > 40) lbStep(dx < 0 ? 1 : -1);
      },

      emailLabel: s.copied === 'email' ? 'Copied to clipboard' : 'Copy my email',
      copyEmail: () => this.copy('hello@pierrejames.design', 'email'),
      linkLabel: s.copied === 'link' ? 'Copied' : 'Copy link',
      copyLink: () => this.copy('https://pierrejames.design' + path, 'link'),

      // game
      setCanvas: this.setCanvas,
      canvasClass: s.game === 'playing' ? 'playing' : '',
      gMouseDown: (e) => { if (e.button !== undefined && e.button !== 0) return; this.press(); try { this.cv.focus({ preventScroll: true }); } catch (er) {} },
      gTouch: (e) => { if (this.g && this.cv && e.touches && e.touches[0]) { const r = this.cv.getBoundingClientRect(); this.g.tx = e.touches[0].clientX - r.left; } },
      gTouchStart: (e) => { if (this.g && this.cv && e.touches && e.touches[0]) { const r = this.cv.getBoundingClientRect(); this.g.tx = e.touches[0].clientX - r.left; } },
      gKeyDown: (e) => {
        const g = this.g; if (!g) return;
        const st = this.state.game;
        if (e.key === 'ArrowLeft') { g.keys.left = true; e.preventDefault(); }
        else if (e.key === 'ArrowRight') { g.keys.right = true; e.preventDefault(); }
        else if (e.key === ' ' || e.key === 'Spacebar' || e.key === 'Enter') { e.preventDefault(); if (st === 'playing') g.keys.fire = true; this.press(); }
        else if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
          if (st === 'playing') { e.preventDefault(); this.pause(); } else if (st === 'paused') { e.preventDefault(); this.resume(); }
        }
      },
      gKeyUp: (e) => { const g = this.g; if (!g) return; if (e.key === 'ArrowLeft') g.keys.left = false; if (e.key === 'ArrowRight') g.keys.right = false; if (e.key === ' ' || e.key === 'Spacebar' || e.key === 'Enter') g.keys.fire = false; },

      // work db
      workCount: list.length === PROJECTS.length ? String(PROJECTS.length) : list.length + ' of ' + PROJECTS.length,
      workList: list, emptyWork: list.length === 0,
      galleryMode: s.dbView === 'gallery', tableMode: s.dbView === 'table',
      showGallery: s.dbView === 'gallery' && list.length > 0, showTable: s.dbView === 'table' && list.length > 0,
      tabGalleryBg: s.dbView === 'gallery' ? '#2c2c2c' : 'transparent', tabGalleryFg: s.dbView === 'gallery' ? '#ffffff' : '#a8a8a8',
      tabTableBg: s.dbView === 'table' ? '#2c2c2c' : 'transparent', tabTableFg: s.dbView === 'table' ? '#ffffff' : '#a8a8a8',
      setGallery: () => this.setState({ dbView: 'gallery' }), setTable: () => this.setState({ dbView: 'table' }),
      sortIsNew: s.sort === 'new', sortIsOld: s.sort === 'old',
      sortNewBg: s.sort === 'new' ? '#2c2c2c' : 'transparent', sortNewFg: s.sort === 'new' ? '#ffffff' : '#a8a8a8',
      sortOldBg: s.sort === 'old' ? '#2c2c2c' : 'transparent', sortOldFg: s.sort === 'old' ? '#ffffff' : '#a8a8a8',
      sortNew: () => this.setState({ sort: 'new' }), sortOld: () => this.setState({ sort: 'old' }),
      tagChips: tagChips, typeChips: typeChips,
      filtersActive: s.tags.length > 0 || s.type !== 'All',
      resetFilters: () => this.setState({ tags: [], type: 'All' }),

      // project
      proj: proj, toc: toc,
      setLayer: this.setLayer,
      closePeek: () => this.closePeek(),
      expand: () => this.openFull(s.peek),
      peekPrev: () => this.stepPeek(-1), peekNext: () => this.stepPeek(1),
      layerKey: (e) => { if (e.key === 'Escape' && this.state.peek) { e.preventDefault(); this.closePeek(); } },

      setLb: this.setLb,

      // menu
      menuOpen: s.menu, menuClosed: !s.menu,
      setMenu: this.setMenu, setPill: this.setPill,
      openMenu: () => { this.restorePill = true; this.setState({ menu: true }); },
      closeMenu: () => { this.restorePill = true; this.setState({ menu: false }); },
      menuItems: menuItems,
      homeColor: homeActive ? '#ffffff' : '#8f8f8f', homeCurrent: homeActive ? 'location' : undefined,
      menuKey: (e) => {
        if (e.key === 'Escape') { e.preventDefault(); this.restorePill = true; this.setState({ menu: false }); return; }
        if (e.key === 'Tab' || e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          const items = this.menuEl ? Array.prototype.slice.call(this.menuEl.querySelectorAll('button')) : [];
          if (!items.length) return;
          const i = items.indexOf(document.activeElement);
          const back = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
          e.preventDefault();
          items[(i + (back ? -1 : 1) + items.length) % items.length].focus();
        }
      }
    };
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Component, {"peekStyle":"center","showUrl":true}));
</script>
